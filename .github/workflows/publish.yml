name: Publish to PyPI

# Publishes spOT-NMF to PyPI automatically whenever a GitHub Release is
# published. Uses PyPI Trusted Publishing (OIDC) — no API tokens are stored in
# the repository. A manual run (workflow_dispatch) builds and checks the
# distributions without publishing, for dry-run validation.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('spotnmf/_version.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version | release tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$tag' does not match package version '$version' (spotnmf/_version.py). Bump the version or fix the tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata (PyPI render + validity)
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spot-nmf/
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
