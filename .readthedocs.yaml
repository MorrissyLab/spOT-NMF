# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # pandoc is required by nbsphinx to convert the .ipynb tutorials
    - pandoc

sphinx:
  configuration: docs/source/conf.py
  # Set to true once the docs build cleanly and you want warnings to fail CI
  fail_on_warning: false

python:
  install:
    # Install spOT-NMF itself (so autodoc can import it) plus the doc tooling.
    # torch is intentionally NOT installed here; it is mocked in conf.py.
    - method: pip
      path: .
      extra_requirements:
        - docs
